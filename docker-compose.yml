services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    # REDIS_URL and DATABASE_URL both come from backend/.env now — Redis is
    # Upstash, Postgres is Supabase, neither one is a container on this
    # network anymore, so there's nothing left here to override or depend on.
    #
    # Run one uvicorn worker per container. Metrics are kept in memory per
    # process, so extra workers would split the numbers between them. To scale,
    # add containers (or pods) and let Prometheus add the series up.
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # Phase 5, optional: usage events through Kafka. These two only start with
  #   docker compose --profile kafka up --build
  # and the backend only uses them once backend/.env has
  #   KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  # Without that, usage rows are written to Postgres directly, as before.
  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Reads the usage events and writes them to Postgres in batches.
  # Liveness: http://localhost:8001/consumer/health
  consumer:
    profiles: ["kafka"]
    build: ./backend
    command: python -m app.consumer
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend:/app
    depends_on:
      - kafka
      - backend

  # Scrapes GET /metrics on the backend every 15 seconds.
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

  # Open http://localhost:3001. The two dashboards are loaded automatically.
  # Settings come from a .env file next to this one, see .env.example.
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read only access to the gateway database, for the cost and usage dashboard.
      GRAFANA_PG_HOST: ${GRAFANA_PG_HOST:-}
      GRAFANA_PG_DATABASE: ${GRAFANA_PG_DATABASE:-postgres}
      GRAFANA_PG_USER: ${GRAFANA_PG_USER:-grafana_ro}
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:-}
      GRAFANA_PG_SSLMODE: ${GRAFANA_PG_SSLMODE:-require}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
